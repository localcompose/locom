name: Release smoke test

on:
  release:
    types: [published]  # runs automatically on published release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test"
        required: true
        type: choice
        options:
          - 0.0.3-poc
          - v0.0.2
          - v0.0.1

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # 👈 allows all matrix items to run independently
      matrix:
        include:
          - os: ubuntu-latest
            asset: locom_linux_amd64.tar.gz
          # - os: ubuntu_24.04_arm64
          #   asset: locom_linux_arm64.tar.gz
          - os: macos-latest
            asset: locom_darwin_amd64.tar.gz
          - os: windows-latest
            asset: locom_windows_amd64.zip

    steps:
      - name: Determine release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download release asset
        shell: bash
        run: |
          gh release download "${{ steps.vars.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.asset }}" \
            --dir ./dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binaries
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Resolve Windows HOME properly
            pwsh -NoLogo -NoProfile -Command '
              $dest = Join-Path $env:USERPROFILE ".local\bin";
              New-Item -ItemType Directory -Force -Path $dest | Out-Null;
              Expand-Archive "dist\\${{ matrix.asset }}" -DestinationPath $dest -Force
            '
          else
            tar -xzf "dist/${{ matrix.asset }}" -C "$HOME/.local/bin"
            chmod +x "$HOME/.local/bin/locom"
          fi

      - name: Add to PATH (Linux/macOS)
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        if: runner.os != 'Windows'

      - name: Add to PATH (Windows)
        run: echo "${env:USERPROFILE}\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'

      - name: Smoke test (no args)
        run: locom || true

      - name: Version check
        run: locom version

      - name: Stage init
        run: locom init stage

      - name: Hosts verify
        run: |
          cd stage
          locom hosts --verify

      - name: Network
        run: |
          docker info
          echo "=================" 
          docker info | grep -i rootless
          echo "=================" 
          cd stage
          locom network

      - name: Proxy
        run: |
          cd stage
          locom proxy

      - name: cert selfsigned setup
        run: |
          locom cert selfsigned setup

      - name: cert selfsigned trust
        run: |
          locom cert selfsigned trust

      - name: curl
        run: |
          cat /etc/hosts
          echo "=================" 
          curl -I https://proxy.locom.self
          curl https://proxy.locom.self
          curl -L https://proxy.locom.self
          curl -s -o /dev/null -w "%{http_code}\n" https://proxy.locom.self
